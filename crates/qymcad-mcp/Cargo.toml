[package]
name = "qymcad-mcp"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "The agent's server: the MCP protocol over the program's session door, on the loopback interface, one agent for the hosted document"
publish = false

# THE PROTOCOL'S WEIGHT LIVES IN THIS CRATE and is seen by nothing else in the tree: rmcp brings tokio and
# the HTTP stack with it, and the main thread stays winit's - the runtime runs on the server thread only.
# rmcp 3.5.1 (the official Rust SDK) declares rust-version 1.88, the workspace floor exactly, verified
# before adoption; its streamable-HTTP server feature is the one transport that fits a server inside an
# already-running program (stdio would require the client to spawn the program). rmcp serves a Tower
# service; axum mounts it (and carries the token check as middleware), tokio runs it - all on the server
# thread, never on the window's. The MSRVs (axum 1.80, tokio 1.71, tokio-util 1.85) sit under the floor.
[dependencies]
qymcad = { path = "../qymcad" }
# THE PROGRAM'S OWN HELP, the toolset reads it: the same articles F1 opens, named by the command catalogue.
qymcad-help = { path = "../qymcad-help" }
# THE PROGRAM'S OWN DICTIONARY, the operations of the whole program are named by it: a menu item of
# their own, a bar button - the same words the window shows, read so the agent's names cannot drift
# from the person's.
qymcad-i18n = { path = "../qymcad-i18n" }
# THE FORMATS THE FILE OPERATIONS NAME, from the tables where the program itself holds them: the exact
# formats of the kernel, the mesh formats of the state - the same enums the session's doors take.
qymcad-kernel = { path = "../qymcad-kernel" }
qymcad-ui-state = { path = "../qymcad-ui-state" }
rmcp = { version = "3.5.1", features = ["transport-streamable-http-server"] }
axum = "0.8"
tokio = { version = "1", features = ["rt", "time", "net"] }
tokio-util = "0.7"
# The shapes of the tools' parameters and the JSON of their answers. serde, serde_json, schemars and base64
# are already in the tree through rmcp - the direct edges name what the toolset itself says, no new code.
serde = { workspace = true }
serde_json = "1.0.151"
schemars = "1.2"
base64 = "0.23"

[lints]
workspace = true
